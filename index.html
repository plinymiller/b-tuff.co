    var nav = document.getElementById("socials");
    var cfgEl = document.getElementById("socials-config");
    if (!nav || !cfgEl) return;
    var config;
    try { config = JSON.parse(cfgEl.textContent); } catch (e) { return; }
    var ul = document.createElement("ul");
    ul.className = "social-list";
    config.forEach(function (item) {
      if (!item || !item.enabled || !item.url || !SOCIAL_ICONS[item.platform]) return;
      var li = document.createElement("li");
      var a = document.createElement("a");
      a.href = item.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", "B-Tuff on " + item.platform + " (opens in a new tab)");

      li.appendChild(a);
      ul.appendChild(li);
    });
